name: sophosstats

# Alle Einstellungen kommen aus Umgebungsvariablen: lokal aus der .env neben dieser Datei,
# in Portainer aus den "Environment variables" des Stacks.

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+asyncpg://sophosstats:${POSTGRES_PASSWORD}@db:5432/sophosstats
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY setzen}
    INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
    INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
    RETENTION_METRICS_DAYS: ${RETENTION_METRICS_DAYS:-90}
    RETENTION_LOGS_DAYS: ${RETENTION_LOGS_DAYS:-30}
    RETENTION_RULE_USAGE_DAYS: ${RETENTION_RULE_USAGE_DAYS:-400}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sophosstats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen}
      POSTGRES_DB: sophosstats
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sophosstats -d sophosstats"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  collector:
    <<: *backend
    command: ["python", "-m", "app.collector"]
    ports:
      - "5514:5514/udp"
      - "5514:5514/tcp"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Für die HTTP->HTTPS-Weiterleitung: Port, unter dem HTTPS von außen erreichbar ist
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Ohne eigenes Zertifikat wird beim ersten Start ein selbstsigniertes erzeugt.
      # Eigenes Zertifikat: tls.crt + tls.key in dieses Volume legen und den Container neu starten.
      - certs:/etc/nginx/certs

volumes:
  db-data:
  certs:
